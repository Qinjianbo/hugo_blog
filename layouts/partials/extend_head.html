{{- if or hugo.IsProduction (eq site.Params.env "production") }}
  {{- partial "ai_meta.html" . }}
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9980006545865573"
     crossorigin="anonymous"></script>
{{- $banner := site.Params.homeBanner -}}
{{- if and .IsHome $banner $banner.image }}
  <link rel="preload" as="image" href="{{ $banner.image | relURL }}">
{{- end }}
<!-- Baidu Analytics (legacy from Dream theme) -->
<script>

  (function() {

    hm.src = "https://hm.baidu.com/hm.js?aea13b8a38780f1f66760cfeb0028fea";
    var s = document.getElementsByTagName("script")[0];
    s.parentNode.insertBefore(hm, s);

</script>
{{- end }}
